services:

  # ── PostgreSQL Database ──────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: plantation_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-12345}
      POSTGRES_DB: ${DB_NAME:-plantation_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-plantation_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis  (Celery broker + result backend) ──────────────────
  redis:
    image: redis:7-alpine
    container_name: plantation_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: plantation_backend:latest
    container_name: plantation_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-12345}@db:5432/${DB_NAME:-plantation_db}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      TILES_DIR: /app/tiles
    volumes:
      - uploads_data:/app/uploads
      - tiles_data:/app/tiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Celery Worker ────────────────────────────────────────────
  worker:
    image: plantation_backend:latest
    container_name: plantation_worker
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-12345}@db:5432/${DB_NAME:-plantation_db}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      TILES_DIR: /app/tiles
    volumes:
      - uploads_data:/app/uploads
      - tiles_data:/app/tiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── React Frontend (Nginx) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    container_name: plantation_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

# ── Named Volumes ────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  uploads_data:
  tiles_data:
